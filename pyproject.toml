[project]
name = "crypto_cost_monitor_project"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pandas",
    "dbt-core>=1.12,<1.13",
    "dbt-snowflake>=1.12,<1.13",
    "pytest",
    "boto3",
]
license = "MIT"
license-files = ["LICENSE"]


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["src"]