crypto_cost_monitor:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: dbt_user
      role: transformer
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      warehouse: crypto_wh
      database: crypto_cost_monitor
      schema: dev
      threads: 4