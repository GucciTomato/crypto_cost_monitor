name: dbt refresh

on:
  schedule:
    # every 2 hours (5 minutes) after the hourly load task
    - cron: "05 */2 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_PRIVATE_KEY_PATH: /home/runner/.snowflake/dbt_key.p8

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Write private key
        run: |
          mkdir -p ~/.snowflake
          echo "${{ secrets.SNOWFLAKE_DBT_PRIVATE_KEY }}" > ~/.snowflake/dbt_key.p8
          chmod 600 ~/.snowflake/dbt_key.p8

      - name: Re-fresh dbt project
        working-directory: src/dbt
        run: |
          dbt deps
          dbt build